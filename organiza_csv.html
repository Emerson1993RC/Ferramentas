<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Organizador de Listas</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { text-align: center; }
    textarea { width: 100%; height: 150px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #000; padding: 6px; font-size: 12px; }
    th { background: #eee; }
    .red { background-color: #f8d7da; }
    .orange { background-color: #fff3cd; }
    .yellow { background-color: #fff9c4; }
    .green { background-color: #d4edda; }
    .controls { margin-bottom: 10px; }
    button { padding: 8px 12px; cursor: pointer; margin-top: 5px; }
    @media print {
      textarea, .controls { display: none; }
    }
  </style>
</head>
<body>

<h1 id="tituloPagina">Organizador de Listas</h1>

<div class="controls">
  <label><strong>Título da lista:</strong></label><br>
  <input type="text" id="tituloInput" placeholder="Ex: Lista de Diabéticos" style="width:100%; padding:6px; margin-bottom:10px;">
</div>

<div class="controls">
  <label><strong>Cole os dados aqui:</strong></label>
  <textarea id="entrada" placeholder="Cole aqui o CSV..."></textarea><br>
  <button onclick="gerarTabela()">Gerar Tabela</button>
  <button onclick="window.print()">Imprimir / Salvar em PDF</button>
</div>

<table id="tabela">
  <thead>
    <tr id="cabecalho"></tr>
  </thead>
  <tbody></tbody>
</table>

<script>
function getClasse(status) {
  if (!status) return "";
  if (status.includes("🔴") || status.includes("❌")) return "red";
  if (status.includes("🟠")) return "orange";
  if (status.includes("🟡")) return "yellow";
  if (status.includes("✅")) return "green";
  return "";
}

function gerarTabela() {
  const titulo = document.getElementById("tituloInput").value;
  if (titulo) {
    document.getElementById("tituloPagina").innerText = titulo;
  }
  const texto = document.getElementById("entrada").value.trim();
  const linhas = texto
    .split("\n")
    .map(l => l.trim())
    .filter(l => l && l !== ".")
  const tbody = document.querySelector("#tabela tbody");
  const cabecalho = document.getElementById("cabecalho");

  tbody.innerHTML = "";
  cabecalho.innerHTML = "";

  const primeiraLinha = linhas[0];
  const temCabecalho = primeiraLinha.toLowerCase().includes("nome");
  const colunas = primeiraLinha.split(",").length;

  // DETECTAR TIPO PELO CABEÇALHO
  const headerLower = primeiraLinha.toLowerCase();
  const ehVacina = headerLower.includes("status vacinal");
  const ehGestante = headerLower.includes("ig") || headerLower.includes("pendências");

  // FORMATO VACINAL
  if (ehVacina && colunas === 6) {
    cabecalho.innerHTML = `
      <th>Nome</th>
      <th>Micro</th>
      <th>Idade</th>
      <th>Status Vacinal</th>
      <th>Doses Faltantes</th>
    `;

    (temCabecalho ? linhas.slice(1) : linhas).forEach(linha => {
      const col = linha.replace(/\.$/,"").split(",")
      if (col.length < 6) return;

      const tr = document.createElement("tr");
      tr.className = getClasse(col[4]);

      tr.innerHTML = `
        <td>${col[1]}</td>
        <td>${col[2]}</td>
        <td>${col[3]}</td>
        <td>${col[4]}</td>
        <td>${col.slice(5).join(",")}</td>
      `;

      tbody.appendChild(tr);
    });

  } else if (ehGestante && colunas === 6) {
    // FORMATO GESTANTE
    cabecalho.innerHTML = `
      <th>Nome</th>
      <th>Microárea</th>
      <th>IG (sem)</th>
      <th>Status</th>
      <th>Pendências</th>
    `;

    (temCabecalho ? linhas.slice(1) : linhas).forEach(linha => {
      const col = linha.replace(/\.$/,"").split(",")
      if (col.length < 6) return;

      const tr = document.createElement("tr");
      tr.className = getClasse(col[4]);

      tr.innerHTML = `
        <td>${col[1]}</td>
        <td>${col[2]}</td>
        <td>${col[3]}</td>
        <td>${col[4]}</td>
        <td>${col.slice(5).join(",")}</td>
      `;

      tbody.appendChild(tr);
    });

  } else if (colunas === 6 && headerLower.includes("situação")) {
    // FORMATO INFANTIL COM PENDÊNCIAS
    cabecalho.innerHTML = `
      <th>Nome</th>
      <th>Micro</th>
      <th>Idade</th>
      <th>Situação</th>
      <th>Pendências</th>
    `;

    (temCabecalho ? linhas.slice(1) : linhas).forEach(linha => {
      const col = linha.replace(/\.$/,"").split(",")
      if (col.length < 6) return;

      const tr = document.createElement("tr");
      tr.className = getClasse(col[4]);

      tr.innerHTML = `
        <td>${col[1]}</td>
        <td>${col[2]}</td>
        <td>${col[3]}</td>
        <td>${col[4]}</td>
        <td>${col.slice(5).join(",")}</td>
      `;

      tbody.appendChild(tr);
    });

  } else if (colunas === 6) {
    // FORMATO INFANTIL
    cabecalho.innerHTML = `
      <th>Nome</th>
      <th>Micro</th>
      <th>Idade</th>
      <th>Situação</th>
      <th>O que fazer</th>
    `;

    linhas.forEach(linha => {
      const col = linha.replace(/\.$/,"").split(",")
      if (col.length < 6) return;

      const tr = document.createElement("tr");
      tr.className = getClasse(col[4]);

      tr.innerHTML = `
        <td>${col[1]}</td>
        <td>${col[2]}</td>
        <td>${col[3]}</td>
        <td>${col[4]}</td>
        <td>${col.slice(5).join(",")}</td>
      `;

      tbody.appendChild(tr);
    });
    } else if (colunas === 7) {
    // FORMATO HAS / BUSCA ATIVA COMPLETO
    cabecalho.innerHTML = `
      <th>Nome</th>
      <th>Microárea</th>
      <th>Peso/Altura</th>
      <th>PA</th>
      <th>Consulta</th>
      <th>Status</th>
    `;

    (temCabecalho ? linhas.slice(1) : linhas).forEach(linha => {
      const col = linha.replace(/\.$/,"").split(",")
      if (col.length < 7) return;

      const tr = document.createElement("tr");
      tr.className = getClasse(col[6]);

      tr.innerHTML = `
        <td>${col[1]}</td>
        <td>${col[2]}</td>
        <td>${col[3]}</td>
        <td>${col[4]}</td>
        <td>${col[5]}</td>
        <td>${col[6]}</td>
      `;

      tbody.appendChild(tr);
    });

    } else if (colunas === 9) {
    // FORMATO DIABÉTICOS / ACOMPANHAMENTO COMPLETO
    cabecalho.innerHTML = `
      <th>Nome</th>
      <th>Microárea</th>
      <th>Peso/Altura</th>
      <th>PA</th>
      <th>Médico (meses)</th>
      <th>Enf (meses)</th>
      <th>HbA1c</th>
      <th>Status</th>
    `;

    (temCabecalho ? linhas.slice(1) : linhas).forEach(linha => {
      const col = linha.replace(/\.$/,"").split(",")
      if (col.length < 9) return;

      const tr = document.createElement("tr");
      tr.className = getClasse(col[8]);

      tr.innerHTML = `
        <td>${col[1]}</td>
        <td>${col[2]}</td>
        <td>${col[3]}</td>
        <td>${col[4]}</td>
        <td>${col[5]}</td>
        <td>${col[6]}</td>
        <td>${col[7]}</td>
        <td>${col[8]}</td>
      `;

      tbody.appendChild(tr);
    });

    } else if (colunas === 10) {
    // FORMATO VACINA DETALHADO (Penta, Pólio, Pneumo, SCR)
    cabecalho.innerHTML = `
      <th>Nome</th>
      <th>Micro</th>
      <th>Idade</th>
      <th>Penta</th>
      <th>Pólio</th>
      <th>Pneumo</th>
      <th>SCR</th>
      <th>Status Geral</th>
      <th>O que falta</th>
    `;

    (temCabecalho ? linhas.slice(1) : linhas).forEach(linha => {
      const col = linha.replace(/\.$/,"").split(",")
      if (col.length < 10) return;

      const tr = document.createElement("tr");
      tr.className = getClasse(col[8]);

      tr.innerHTML = `
        <td>${col[1]}</td>
        <td>${col[2]}</td>
        <td>${col[3]}</td>
        <td>${col[4]}</td>
        <td>${col[5]}</td>
        <td>${col[6]}</td>
        <td>${col[7]}</td>
        <td>${col[8]}</td>
        <td>${col.slice(9).join(",")}</td>
      `;

      tbody.appendChild(tr);
    });

  }
}
</script>

</body>
</html>
